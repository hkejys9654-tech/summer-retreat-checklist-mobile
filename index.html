<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하계수양회 준비물 체크리스트</title>
  <meta name="theme-color" content="#2f6df6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하계수양회 준비물">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #666f7a;
      --line: #dfe4ea;
      --paper: #fffaf2;
      --surface: #ffffff;
      --surface-strong: #f5f7fb;
      --blue: #2f6df6;
      --mint: #19a974;
      --yellow: #ffd34d;
      --coral: #ff6b57;
      --violet: #7a5cff;
      --shadow: 0 14px 36px rgba(22, 28, 45, 0.12);
      --fast: 160ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        linear-gradient(120deg, rgba(47, 109, 246, 0.12), transparent 34%),
        linear-gradient(240deg, rgba(25, 169, 116, 0.12), transparent 40%),
        var(--paper);
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 8px 0 18px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
    }

    .kicker::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--coral);
      box-shadow: 14px 0 0 var(--yellow), 28px 0 0 var(--mint);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .title-line {
      display: inline;
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .progress-panel {
      width: min(330px, 100%);
      padding: 18px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
    }

    .progress-count {
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }

    .progress-rate {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      color: var(--blue);
    }

    .progress-track {
      position: relative;
      overflow: hidden;
      height: 12px;
      margin-top: 14px;
      border-radius: 999px;
      background: #e9edf4;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--blue), var(--violet));
      transition: width 280ms ease;
    }

    .toolbar {
      position: sticky;
      top: 8px;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 8px 0 24px;
      padding: 12px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 250, 242, 0.86);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 24px rgba(22, 28, 45, 0.08);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn,
    .action-btn {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 800;
      transition: transform var(--fast), border-color var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .filter-btn:hover,
    .action-btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 10px 18px rgba(47, 109, 246, 0.14);
    }

    .filter-btn.is-active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .action-btn::before {
      content: "↺";
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      font-size: 17px;
      line-height: 1;
    }

    .adder {
      display: grid;
      grid-template-columns: minmax(145px, 180px) 1fr auto;
      gap: 10px;
      margin: 10px 0 24px;
      padding: 12px;
      border: 1px dashed rgba(47, 109, 246, 0.35);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .add-panel {
      margin: 0 0 24px;
    }

    .add-panel summary {
      list-style: none;
    }

    .add-panel summary::-webkit-details-marker {
      display: none;
    }

    .add-toggle {
      min-height: 44px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(47, 109, 246, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--blue);
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(22, 28, 45, 0.06);
    }

    .add-toggle::before {
      content: "+";
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      line-height: 1;
    }

    .adder select,
    .adder input {
      min-height: 46px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color var(--fast), box-shadow var(--fast);
    }

    .adder select {
      padding: 0 12px;
      font-weight: 800;
    }

    .adder input {
      padding: 0 14px;
      font-weight: 700;
    }

    .adder select:focus,
    .adder input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 109, 246, 0.14);
    }

    .add-btn {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
      transition: transform var(--fast), background var(--fast), box-shadow var(--fast);
    }

    .add-btn:hover {
      transform: translateY(-2px);
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(47, 109, 246, 0.24);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .category {
      min-width: 0;
      padding: 16px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 12px 28px rgba(22, 28, 45, 0.08);
      transition: transform var(--fast), box-shadow var(--fast), border-color var(--fast);
    }

    .category:hover {
      transform: translateY(-3px);
      border-color: rgba(47, 109, 246, 0.22);
      box-shadow: 0 18px 36px rgba(22, 28, 45, 0.14);
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .category-mark {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
    }

    .category-count {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f0f3f7;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .items {
      display: grid;
      gap: 9px;
    }

    .item {
      position: relative;
      min-height: 58px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(23, 23, 23, 0.04);
      transition: transform var(--fast), border-color var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .item-main {
      min-height: 58px;
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 10px 52px 10px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    .item:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(47, 109, 246, 0.62);
      box-shadow: 0 14px 26px rgba(47, 109, 246, 0.14);
    }

    .item:active {
      transform: translateY(0) scale(0.985);
    }

    .item-main:focus-visible,
    .delete-btn:focus-visible {
      outline: 3px solid rgba(47, 109, 246, 0.32);
      outline-offset: 2px;
    }

    .item.is-checked {
      border-color: rgba(25, 169, 116, 0.45);
      background: linear-gradient(90deg, rgba(25, 169, 116, 0.16), rgba(47, 109, 246, 0.10));
      box-shadow: 0 8px 18px rgba(25, 169, 116, 0.13);
    }

    .check {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 2px solid #c5ced9;
      background: #fff;
      color: #fff;
      transition: transform var(--fast), border-color var(--fast), background var(--fast);
    }

    .check::before {
      content: "";
      width: 13px;
      height: 7px;
      border-left: 3px solid currentColor;
      border-bottom: 3px solid currentColor;
      transform: rotate(-45deg) translate(1px, -1px) scale(0);
      transition: transform 180ms ease;
    }

    .item.is-checked .check {
      border-color: var(--mint);
      background: var(--mint);
      transform: rotate(4deg) scale(1.08);
    }

    .item.is-checked .check::before {
      transform: rotate(-45deg) translate(1px, -1px) scale(1);
    }

    .item-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.25;
    }

    .item.is-checked .item-name {
      color: #244235;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(25, 169, 116, 0.48);
    }

    .item-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .badge {
      min-width: 44px;
      padding: 6px 8px;
      border-radius: 999px;
      background: #f3f5f8;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      transition: background var(--fast), color var(--fast), transform var(--fast);
    }

    .item.is-checked .badge {
      background: var(--mint);
      color: #fff;
      transform: scale(1.04);
    }

    .delete-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 107, 87, 0.34);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--coral);
      font-size: 16px;
      font-weight: 950;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.82) rotate(-8deg);
      transition: opacity var(--fast), transform var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .item:hover .delete-btn,
    .item:focus-within .delete-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1) rotate(0deg);
    }

    .delete-btn:hover {
      background: var(--coral);
      color: #fff;
      box-shadow: 0 10px 18px rgba(255, 107, 87, 0.24);
    }

    .item.is-hidden {
      display: none;
    }

    .burst {
      position: absolute;
      inset: 50% auto auto 18px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--yellow);
      pointer-events: none;
      animation: pop 520ms ease forwards;
      box-shadow:
        20px -14px 0 var(--coral),
        34px 5px 0 var(--blue),
        14px 17px 0 var(--mint),
        -11px 11px 0 var(--violet);
    }

    @keyframes pop {
      from {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.4) rotate(24deg);
      }
    }

    .empty {
      display: none;
      margin: 22px 0;
      padding: 22px;
      border: 1px dashed rgba(23, 23, 23, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    .empty.is-visible {
      display: block;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .progress-panel {
        width: 100%;
      }

      .board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .app {
        width: 100%;
        padding: calc(12px + env(safe-area-inset-top)) 12px 36px;
      }

      .topbar {
        gap: 12px;
        align-items: stretch;
        padding: 16px;
        border: 1px solid rgba(23, 23, 23, 0.06);
        border-radius: 8px;
        background: linear-gradient(135deg, #ffffff 0%, #f7fbff 56%, #fff7ef 100%);
        box-shadow: 0 10px 22px rgba(22, 28, 45, 0.08);
      }

      .kicker {
        margin-bottom: 8px;
        font-size: 12px;
      }

      .kicker::before {
        width: 8px;
        height: 8px;
        box-shadow: 12px 0 0 var(--yellow), 24px 0 0 var(--mint);
      }

      h1 {
        max-width: 100%;
        font-size: 26px;
        line-height: 1.16;
      }

      .title-line {
        display: block;
      }

      .subtitle {
        display: none;
      }

      .progress-panel {
        padding: 12px;
        border-color: rgba(47, 109, 246, 0.12);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: none;
      }

      .progress-count {
        font-size: 13px;
      }

      .progress-rate {
        font-size: 24px;
      }

      .progress-track {
        height: 10px;
        margin-top: 10px;
      }

      .toolbar,
      .adder {
        grid-template-columns: 1fr;
      }

      .toolbar {
        position: static;
        gap: 10px;
        margin: 12px 0;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        padding: 4px;
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
      }

      .filter-btn {
        min-height: 40px;
        padding: 0 6px;
        border: 0;
        background: transparent;
        font-size: 14px;
      }

      .filter-btn:hover {
        transform: none;
        box-shadow: none;
      }

      .filter-btn.is-active {
        background: var(--blue);
        box-shadow: 0 8px 18px rgba(47, 109, 246, 0.18);
      }

      .action-btn {
        min-height: 40px;
        border-color: rgba(23, 23, 23, 0.08);
        background: rgba(255, 255, 255, 0.82);
        font-size: 14px;
      }

      .action-btn:hover {
        transform: none;
        box-shadow: none;
      }

      .add-panel {
        margin: 0 0 12px;
      }

      .add-toggle {
        min-height: 42px;
        font-size: 14px;
        box-shadow: none;
      }

      .adder {
        gap: 8px;
        margin: 8px 0 0;
        padding: 10px;
        border-style: solid;
        border-color: rgba(23, 23, 23, 0.08);
        background: rgba(255, 255, 255, 0.82);
      }

      .adder select,
      .adder input,
      .add-btn {
        min-height: 42px;
        font-size: 14px;
      }

      .action-btn,
      .add-btn {
        width: 100%;
      }

      .board {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .category {
        padding: 12px;
        box-shadow: 0 8px 18px rgba(22, 28, 45, 0.07);
      }

      .category:hover {
        transform: none;
        box-shadow: 0 8px 18px rgba(22, 28, 45, 0.07);
      }

      .category-head {
        gap: 8px;
        margin-bottom: 10px;
      }

      .category-title {
        gap: 8px;
        font-size: 18px;
      }

      .category-mark {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 13px;
      }

      .category-count {
        padding: 6px 8px;
        font-size: 12px;
      }

      .items {
        gap: 8px;
      }

      .item {
        min-height: 54px;
        box-shadow: none;
      }

      .item:hover {
        transform: none;
        border-color: var(--line);
        box-shadow: none;
      }

      .item-main {
        min-height: 54px;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
        padding: 10px 44px 10px 10px;
      }

      .check {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .item-name {
        font-size: 15px;
        line-height: 1.28;
      }

      .item-note {
        font-size: 12px;
      }

      .badge {
        display: none;
      }

      .delete-btn {
        right: 8px;
        width: 30px;
        height: 30px;
        border: 0;
        background: transparent;
        color: rgba(255, 107, 87, 0.72);
        font-size: 18px;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) scale(1);
      }

      .delete-btn:hover {
        background: rgba(255, 107, 87, 0.1);
        color: var(--coral);
        box-shadow: none;
      }
    }

    @media (hover: none) {
      .delete-btn {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-label="체크리스트 요약">
      <div>
        <p class="kicker">설치봉사 짐싸기</p>
        <h1><span class="title-line">하계수양회 준비물</span><span class="title-line">체크리스트</span></h1>
        <p class="subtitle">챙긴 물건은 카드째로 눌러 체크. 마우스를 올리면 튀어나오고, 누르면 색이 바뀌면서 완료 표시가 남습니다.</p>
      </div>

      <aside class="progress-panel" aria-live="polite">
        <div class="progress-row">
          <span class="progress-count" id="progressCount">0 / 0 완료</span>
          <strong class="progress-rate" id="progressRate">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </aside>
    </section>

    <section class="toolbar" aria-label="보기 옵션">
      <div class="filters" role="group" aria-label="체크 상태 필터">
        <button class="filter-btn is-active" type="button" data-filter="all">전체</button>
        <button class="filter-btn" type="button" data-filter="todo">남은 것</button>
        <button class="filter-btn" type="button" data-filter="done">완료</button>
      </div>
      <button class="action-btn" id="resetBtn" type="button">체크 초기화</button>
    </section>

    <details class="add-panel">
      <summary class="add-toggle">항목 추가</summary>
      <form class="adder" id="addForm">
        <select id="categorySelect" aria-label="추가할 카테고리"></select>
        <input id="newItemInput" type="text" autocomplete="off" placeholder="추가할 준비물 입력">
        <button class="add-btn" type="submit">추가</button>
      </form>
    </details>

    <section class="board" id="board" aria-label="준비물 목록"></section>
    <p class="empty" id="emptyState">지금 보기에는 표시할 항목이 없습니다.</p>
  </main>

  <script>
    const STORAGE_KEY = "summer-retreat-service-checklist-v1";
    const CUSTOM_KEY = "summer-retreat-service-custom-items-v1";
    const DELETED_KEY = "summer-retreat-service-deleted-items-v1";

    const categories = [
      {
        id: "wear",
        title: "입고 갈 옷",
        mark: "01",
        items: [
          { id: "wear-tshirt", name: "반팔" },
          { id: "wear-jeans", name: "청바지" },
          { id: "wear-boots", name: "신발", note: "등산화 검정색" },
          { id: "wear-crocs", name: "신발", note: "크록스 검정" }
        ]
      },
      {
        id: "work",
        title: "작업복",
        mark: "02",
        items: [
          { id: "work-training", name: "검정 츄리닝" },
          { id: "work-uniqlo", name: "유니클로 비닐" },
          { id: "work-socks", name: "검정색 긴 양말" },
          { id: "work-northface", name: "노스페이스 검정 반팔" },
          { id: "work-cap", name: "군대 모자" }
        ]
      },
      {
        id: "sleep",
        title: "잠옷",
        mark: "03",
        items: [
          { id: "sleep-underwear", name: "여벌 팬티" },
          { id: "sleep-shorts", name: "반바지" },
          { id: "sleep-northface", name: "노스페이스 검정 반팔", note: "일어나서 그대로 작업복으로 활용" },
          { id: "sleep-neckpillow", name: "목베개" }
        ]
      },
      {
        id: "wash",
        title: "세면도구",
        mark: "04",
        items: [
          { id: "wash-essential", name: "에센셜" },
          { id: "wash-cream", name: "수분크림" },
          { id: "wash-bb", name: "비비크림" },
          { id: "wash-swab", name: "면봉" },
          { id: "wash-razor", name: "면도기" },
          { id: "wash-hair", name: "헤어에센스" },
          { id: "wash-kit", name: "세면도구 책상 위", note: "샴푸, 클렌징 등 들어있음" },
          { id: "wash-towel", name: "수건 한 장" },
          { id: "wash-hanger", name: "옷걸이" },
          { id: "wash-ecobag", name: "에코백" }
        ]
      },
      {
        id: "medicine",
        title: "약",
        mark: "05",
        items: [
          { id: "medicine-tylenol", name: "타이레놀" },
          { id: "medicine-psyllium", name: "차전자피 환 하나" }
        ]
      },
      {
        id: "study",
        title: "필기 도구",
        mark: "06",
        items: [
          { id: "study-bible", name: "성경책" },
          { id: "study-ipad", name: "아이패드" },
          { id: "study-charger", name: "아이패드 충전기", note: "시계 충전기 같이 있는 삼단짜리" }
        ]
      },
      {
        id: "plus",
        title: "추가 후보",
        mark: "07",
        items: [
          { id: "plus-gloves", name: "작업 장갑" },
          { id: "plus-battery", name: "보조배터리" },
          { id: "plus-phone-charger", name: "휴대폰 충전기" },
          { id: "plus-water", name: "물병" },
          { id: "plus-sunscreen", name: "선크림" },
          { id: "plus-bug", name: "모기 패치 또는 벌레퇴치제" },
          { id: "plus-rain", name: "작은 우산 또는 우비" }
        ]
      }
    ];

    let checkedItems = loadSet(STORAGE_KEY);
    let customItems = loadCustomItems();
    let deletedItems = loadSet(DELETED_KEY);
    let currentFilter = "all";

    const board = document.getElementById("board");
    const progressCount = document.getElementById("progressCount");
    const progressRate = document.getElementById("progressRate");
    const progressFill = document.getElementById("progressFill");
    const resetBtn = document.getElementById("resetBtn");
    const emptyState = document.getElementById("emptyState");
    const addForm = document.getElementById("addForm");
    const categorySelect = document.getElementById("categorySelect");
    const newItemInput = document.getElementById("newItemInput");

    function loadSet(key) {
      try {
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
      } catch {
        return new Set();
      }
    }

    function loadCustomItems() {
      try {
        return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveChecked() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedItems]));
    }

    function saveCustomItems() {
      localStorage.setItem(CUSTOM_KEY, JSON.stringify(customItems));
    }

    function saveDeletedItems() {
      localStorage.setItem(DELETED_KEY, JSON.stringify([...deletedItems]));
    }

    function allCategories() {
      const clone = categories.map((category) => ({
        ...category,
        items: category.items.filter((item) => !deletedItems.has(item.id))
      }));

      customItems.forEach((item) => {
        const target = clone.find((category) => category.id === item.categoryId) || clone[clone.length - 1];
        if (!deletedItems.has(item.id)) target.items.push(item);
      });

      return clone.filter((category) => category.items.length > 0);
    }

    function allItems() {
      return allCategories().flatMap((category) => category.items.map((item) => ({
        ...item,
        categoryId: category.id
      })));
    }

    function renderCategoryOptions() {
      categorySelect.innerHTML = categories.map((category) => (
        `<option value="${category.id}">${category.title}</option>`
      )).join("");
    }

    function render() {
      const categoryList = allCategories();

      board.innerHTML = categoryList.map((category) => {
        const checkedCount = category.items.filter((item) => checkedItems.has(item.id)).length;
        const itemButtons = category.items.map((item) => {
          const isChecked = checkedItems.has(item.id);
          const hidden = currentFilter === "done" && !isChecked || currentFilter === "todo" && isChecked;
          const note = item.note ? `<span class="item-note">${escapeHtml(item.note)}</span>` : "";
          const deleteLabel = `${item.name} 삭제`;

          return `
            <div
              class="item ${isChecked ? "is-checked" : ""} ${hidden ? "is-hidden" : ""}"
              data-id="${item.id}"
            >
              <button
                class="item-main"
                type="button"
                data-id="${item.id}"
                aria-pressed="${isChecked}"
              >
                <span class="check" aria-hidden="true"></span>
                <span class="item-name">${escapeHtml(item.name)}${note}</span>
                <span class="badge">${isChecked ? "완료" : "대기"}</span>
              </button>
              <button
                class="delete-btn"
                type="button"
                data-id="${item.id}"
                aria-label="${escapeHtml(deleteLabel)}"
                title="삭제"
              >&times;</button>
            </div>
          `;
        }).join("");

        return `
          <article class="category" data-category="${category.id}">
            <div class="category-head">
              <h2 class="category-title">
                <span class="category-mark">${category.mark}</span>
                <span>${escapeHtml(category.title)}</span>
              </h2>
              <span class="category-count">${checkedCount}/${category.items.length}</span>
            </div>
            <div class="items">${itemButtons}</div>
          </article>
        `;
      }).join("");

      updateProgress();
      updateEmptyState();
    }

    function updateProgress() {
      const total = allItems().length;
      const done = allItems().filter((item) => checkedItems.has(item.id)).length;
      const percent = total ? Math.round(done / total * 100) : 0;

      progressCount.textContent = `${done} / ${total} 완료`;
      progressRate.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
    }

    function updateEmptyState() {
      const visibleItems = board.querySelectorAll(".item:not(.is-hidden)").length;
      emptyState.classList.toggle("is-visible", visibleItems === 0);
    }

    function toggleItem(button) {
      const id = button.dataset.id;
      const becameChecked = !checkedItems.has(id);

      if (becameChecked) {
        checkedItems.add(id);
      } else {
        checkedItems.delete(id);
      }

      saveChecked();
      render();

      if (becameChecked) {
        const freshButton = board.querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (freshButton) showBurst(freshButton);
      }
    }

    function deleteItem(button) {
      const id = button.dataset.id;
      const customCountBefore = customItems.length;

      customItems = customItems.filter((item) => item.id !== id);
      if (customItems.length !== customCountBefore) {
        saveCustomItems();
      } else {
        deletedItems.add(id);
        saveDeletedItems();
      }

      checkedItems.delete(id);
      saveChecked();
      render();
    }

    function showBurst(button) {
      const burst = document.createElement("span");
      burst.className = "burst";
      button.appendChild(burst);
      window.setTimeout(() => burst.remove(), 540);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === filter);
      });
      render();
    }

    function addCustomItem(event) {
      event.preventDefault();

      const value = newItemInput.value.trim();
      if (!value) {
        newItemInput.focus();
        return;
      }

      const categoryId = categorySelect.value;
      const id = `custom-${Date.now()}-${Math.random().toString(16).slice(2)}`;

      customItems.push({ id, categoryId, name: value });
      saveCustomItems();
      newItemInput.value = "";
      render();

      const added = board.querySelector(`[data-id="${CSS.escape(id)}"]`);
      if (added) {
        added.scrollIntoView({ behavior: "smooth", block: "center" });
        added.focus({ preventScroll: true });
      }
    }

    function resetChecks() {
      checkedItems = new Set();
      saveChecked();
      render();
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    board.addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".delete-btn");
      if (deleteButton) {
        deleteItem(deleteButton);
        return;
      }

      const button = event.target.closest(".item-main");
      if (button) toggleItem(button);
    });

    document.querySelectorAll(".filter-btn").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    resetBtn.addEventListener("click", resetChecks);
    addForm.addEventListener("submit", addCustomItem);

    renderCategoryOptions();
    render();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
